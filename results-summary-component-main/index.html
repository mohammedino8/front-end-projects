<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Fikri mohammed Amine | Results summary component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
<main>



  <div class="result">
    <h1 class="resultHeading">Your Result</h1>
    <div class="resultNum">
      <span>76</span>
      <div>of 100</div>
    </div>
    <span class="spanMessage">Great</span>
    <div class="message">You scored higher than 65% of the people who have taken these tests.
  </div>
  </div>


  <div class="summary">
    <h2 class="summaryHeading">  
  Summary
    </h2>
    <div class="summary-items">
      
    <div class="summary-item Reaction">
      <div><img src="./assets/images/icon-reaction.svg" alt=""><span class="text"> Reaction</span></div>
    <div class="score"><span>80</span> / 100</div>
  </div>
    <div class="summary-item Memory"> <div><img src="./assets/images/icon-memory.svg" alt=""><span class="text"> Memory</span></div>
  <div class="score"><span>92</span> / 100</div>
  </div>
    <div class="summary-item Verbal">
      <div><img src="./assets/images/icon-verbal.svg" alt=""><span class="text"> Verbal</span></div>
  <div class="score"><span>61</span> / 100</div>
  </div>
    <div class="summary-item Visual">
    <div><img src="./assets/images/icon-visual.svg" alt=""><span class="text"> Visual</span></div>
  <div class="score"><span>72</span> / 100</div>
  </div>
  <button type="submit">Continue</button>
</main>
  
  



  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/mohammedino8">Fikri Mohammed Amine</a>.
  </footer>
  
</body>
</html>
